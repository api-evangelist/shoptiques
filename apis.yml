aid: shoptiques
name: Shoptiques
description: >-
  Shoptiques is an online marketplace that brings thousands of independently owned local
  boutiques online, letting shoppers discover unique, one-of-a-kind fashion and home decor
  from over 5,000 stores. Founded in 2012 by Olga Vidisheva, the business rebranded its
  merchant/POS arm as Material in 2023 while continuing to operate the Shoptiques consumer
  marketplace. The storefront at shoptiques.com now runs on Shopify and exposes a modern
  agent-facing commerce surface: a published llms.txt / agents.md, Shopify Customer Account
  OpenID Connect + OAuth 2.0 authentication, and a Universal Commerce Protocol (UCP) MCP
  endpoint for buyer-approved, agent-driven shopping and checkout.
